<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth Tester (dev only)</title>
  <!--
    DEV-ONLY tool for testing Phase 4 (Google sign-in + email OTP) before the Angular pages exist.
    Serve on http://localhost:4200 (an authorized Google origin):
      npx --yes http-server tools/auth-tester -p 4200 -c-1
    Not part of the application and never deployed.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1f1f24; --muted:#6b6b76; --border:#e3e3e8; --ok:#188038; --err:#d93025; }
    @media (prefers-color-scheme: dark) { :root { --bg:#212121; --fg:#ececf1; --muted:#a0a0ab; --border:#3a3a40; --ok:#81c995; --err:#f28b82; } }
    body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 'Segoe UI',Arial,sans-serif; }
    main { max-width:560px; margin:24px auto; }
    section { border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:1.25rem; margin:0 0 4px; } h2 { font-size:1rem; margin:0 0 12px; }
    .muted { color:var(--muted); font-size:.875rem; }
    input { font:inherit; font-size:1.5rem; letter-spacing:6px; width:9ch; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; }
    button { font:inherit; padding:8px 16px; margin:8px 8px 0 0; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:.8125rem; padding:12px; border-radius:8px; border:1px solid var(--border); }
    .ok { color:var(--ok); } .err { color:var(--err); }
  </style>
</head>
<body>
<main>
  <section>
    <h1>Auth Tester <span class="muted">(dev only, Phase 4)</span></h1>
    <p class="muted">API: <span id="api"></span></p>
    <h2>1. Sign in with Google</h2>
    <div id="google-button"></div>
  </section>

  <section id="otp-section" hidden>
    <h2>2. Enter the code sent to <span id="masked-email"></span></h2>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <div>
      <button id="verify">Verify code</button>
      <button id="resend" disabled>Resend code</button>
    </div>
    <p class="muted" id="timers"></p>
  </section>

  <section>
    <h2>Last API response</h2>
    <p id="status" class="muted">Nothing yet.</p>
    <pre id="output">-</pre>
  </section>
</main>

<script>
  const API = 'https://localhost:7180/api/auth';
  const CLIENT_ID = '901002317723-lk58p7huv06km29lnstieu4a8rbln0ok.apps.googleusercontent.com';
  document.getElementById('api').textContent = API;

  let challengeToken = null;   // kept in memory only
  let resendAt = 0, expiresAt = 0;

  async function call(path, body) {
    const status = document.getElementById('status');
    status.className = 'muted'; status.textContent = 'Calling ' + path + ' ...';
    try {
      const res = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      status.className = res.ok ? 'ok' : 'err';
      status.textContent = 'POST ' + path + ' -> HTTP ' + res.status;
      // Never echo the challenge token back to the screen.
      const shown = { ...data }; if (shown.challengeToken) shown.challengeToken = '(hidden, ' + shown.challengeToken.length + ' chars)';
      document.getElementById('output').textContent = JSON.stringify(shown, null, 2);
      return { ok: res.ok, data };
    } catch (e) {
      status.className = 'err';
      status.textContent = 'Network error: is the API running on https://localhost:7180? (' + e.message + ')';
      return { ok: false, data: null };
    }
  }

  function applyChallenge(data) {
    challengeToken = data.challengeToken;
    document.getElementById('masked-email').textContent = data.maskedEmail;
    document.getElementById('otp-section').hidden = false;
    resendAt = Date.now() + data.resendAvailableInSeconds * 1000;
    expiresAt = Date.now() + data.expiresInSeconds * 1000;
    document.getElementById('code').focus();
  }

  setInterval(() => {
    if (!challengeToken) return;
    const r = Math.max(0, Math.ceil((resendAt - Date.now()) / 1000));
    const e = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
    document.getElementById('resend').disabled = r > 0;
    document.getElementById('timers').textContent =
      (r > 0 ? 'Resend available in ' + r + 's. ' : 'You can resend now. ') +
      (e > 0 ? 'Code expires in ' + Math.floor(e / 60) + 'm ' + (e % 60) + 's.' : 'Code expired.');
  }, 500);

  async function onGoogleCredential(response) {
    const { ok, data } = await call('/google', { idToken: response.credential });
    if (ok) applyChallenge(data);
  }

  document.getElementById('verify').onclick = async () => {
    const code = document.getElementById('code').value.trim();
    const { ok } = await call('/verify-otp', { challengeToken, code });
    if (ok) { document.getElementById('otp-section').hidden = true; challengeToken = null; }
  };

  document.getElementById('resend').onclick = async () => {
    const { ok, data } = await call('/send-otp', { challengeToken });
    if (ok) applyChallenge(data);
  };

  window.onload = () => {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('google-button'), { theme: 'outline', size: 'large', text: 'continue_with' });
  };
</script>
</body>
</html>
