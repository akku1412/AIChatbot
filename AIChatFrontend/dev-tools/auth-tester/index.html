<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth Tester (dev only)</title>
  <!--
    DEV-ONLY tool for testing Phases 4-5 (Google sign-in, email OTP, JWT + refresh cookie) before the
    Angular login/OTP pages exist. Served by the Angular dev server (development configuration only):
      ng serve, then open http://localhost:4200/dev/auth-tester/index.html
    Calls go to /api, which proxy.conf.json forwards to the API (same origin, so the refresh cookie works).
    Not part of the application and never deployed.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { color-scheme: light dark; --bg:#fff; --fg:#1f1f24; --muted:#6b6b76; --border:#e3e3e8; --ok:#188038; --err:#d93025; }
    @media (prefers-color-scheme: dark) { :root { --bg:#212121; --fg:#ececf1; --muted:#a0a0ab; --border:#3a3a40; --ok:#81c995; --err:#f28b82; } }
    body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 'Segoe UI',Arial,sans-serif; }
    main { max-width:560px; margin:24px auto; }
    section { border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:1.25rem; margin:0 0 4px; } h2 { font-size:1rem; margin:0 0 12px; }
    .muted { color:var(--muted); font-size:.875rem; }
    input { font:inherit; font-size:1.5rem; letter-spacing:6px; width:9ch; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; }
    button, a.button { display:inline-block; font:inherit; padding:8px 16px; margin:8px 8px 0 0; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; cursor:pointer; text-decoration:none; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:.8125rem; padding:12px; border-radius:8px; border:1px solid var(--border); }
    .ok { color:var(--ok); } .err { color:var(--err); }
  </style>
</head>
<body>
<main>
  <section>
    <h1>Auth Tester <span class="muted">(dev only, Phases 4-5)</span></h1>
    <p class="muted">API: <span id="api"></span> (proxied to https://localhost:7180)</p>
    <h2>1. Sign in with Google</h2>
    <div id="google-button"></div>
  </section>

  <section id="otp-section" hidden>
    <h2>2. Enter the code sent to <span id="masked-email"></span></h2>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
    <div>
      <button id="verify">Verify code</button>
      <button id="resend" disabled>Resend code</button>
    </div>
    <p class="muted" id="timers"></p>
  </section>

  <section>
    <h2>3. Session (Phase 5)</h2>
    <p class="muted" id="session-state">No access token in memory.</p>
    <button id="me">GET /users/me</button>
    <button id="me-no-token">GET /users/me without token</button>
    <button id="refresh">POST /auth/refresh</button>
    <button id="logout">POST /auth/logout</button>
    <a class="button" href="/chat">Open protected /chat page</a>
  </section>

  <section>
    <h2>Last API response</h2>
    <p id="status" class="muted">Nothing yet.</p>
    <pre id="output">-</pre>
  </section>
</main>

<script>
  const API = '/api';
  const CLIENT_ID = '901002317723-lk58p7huv06km29lnstieu4a8rbln0ok.apps.googleusercontent.com';
  document.getElementById('api').textContent = API;

  let challengeToken = null;   // kept in memory only
  let accessToken = null;      // kept in memory only
  let resendAt = 0, expiresAt = 0;

  function show(method, path, res, data) {
    const status = document.getElementById('status');
    status.className = res.ok ? 'ok' : 'err';
    status.textContent = method + ' ' + path + ' -> HTTP ' + res.status;
    // Never echo secrets back to the screen.
    const shown = data && typeof data === 'object' ? { ...data } : data;
    if (shown && shown.challengeToken) shown.challengeToken = '(hidden, ' + shown.challengeToken.length + ' chars)';
    if (shown && shown.accessToken) shown.accessToken = '(hidden JWT, ' + shown.accessToken.length + ' chars)';
    document.getElementById('output').textContent = shown === undefined ? '(no body)' : JSON.stringify(shown, null, 2);
  }

  async function call(method, path, body, token) {
    const status = document.getElementById('status');
    status.className = 'muted'; status.textContent = 'Calling ' + method + ' ' + path + ' ...';
    try {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = 'Bearer ' + token;
      const res = await fetch(API + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
      const text = await res.text();
      let data; try { data = text ? JSON.parse(text) : undefined; } catch { data = text; }
      show(method, path, res, data);
      return { ok: res.ok, data };
    } catch (e) {
      status.className = 'err';
      status.textContent = 'Network error: is the API running on https://localhost:7180? (' + e.message + ')';
      return { ok: false, data: null };
    }
  }

  function setToken(token, exp) {
    accessToken = token;
    document.getElementById('session-state').textContent = token
      ? 'Access token in memory, expires ' + new Date(exp).toLocaleTimeString() + '. Refresh token is in an HttpOnly cookie (not visible to JavaScript: document.cookie = "' + document.cookie + '").'
      : 'No access token in memory.';
  }

  function applyChallenge(data) {
    challengeToken = data.challengeToken;
    document.getElementById('masked-email').textContent = data.maskedEmail;
    document.getElementById('otp-section').hidden = false;
    resendAt = Date.now() + data.resendAvailableInSeconds * 1000;
    expiresAt = Date.now() + data.expiresInSeconds * 1000;
    document.getElementById('code').focus();
  }

  setInterval(() => {
    if (!challengeToken) return;
    const r = Math.max(0, Math.ceil((resendAt - Date.now()) / 1000));
    const e = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
    document.getElementById('resend').disabled = r > 0;
    document.getElementById('timers').textContent =
      (r > 0 ? 'Resend available in ' + r + 's. ' : 'You can resend now. ') +
      (e > 0 ? 'Code expires in ' + Math.floor(e / 60) + 'm ' + (e % 60) + 's.' : 'Code expired.');
  }, 500);

  async function onGoogleCredential(response) {
    const { ok, data } = await call('POST', '/auth/google', { idToken: response.credential });
    if (ok) applyChallenge(data);
  }

  document.getElementById('verify').onclick = async () => {
    const code = document.getElementById('code').value.trim();
    const { ok, data } = await call('POST', '/auth/verify-otp', { challengeToken, code });
    if (ok) {
      document.getElementById('otp-section').hidden = true;
      challengeToken = null;
      setToken(data.accessToken, data.accessTokenExpiresAt);
    }
  };

  document.getElementById('resend').onclick = async () => {
    const { ok, data } = await call('POST', '/auth/send-otp', { challengeToken });
    if (ok) applyChallenge(data);
  };

  document.getElementById('me').onclick = () => call('GET', '/users/me', undefined, accessToken);
  document.getElementById('me-no-token').onclick = () => call('GET', '/users/me');
  document.getElementById('refresh').onclick = async () => {
    const { ok, data } = await call('POST', '/auth/refresh', {});
    setToken(ok ? data.accessToken : null, ok ? data.accessTokenExpiresAt : 0);
  };
  document.getElementById('logout').onclick = async () => {
    await call('POST', '/auth/logout', {});
    setToken(null, 0);
  };

  window.onload = () => {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('google-button'), { theme: 'outline', size: 'large', text: 'continue_with' });
  };
</script>
</body>
</html>
